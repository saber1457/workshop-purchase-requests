<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>طلبات شراء ورشة أعمال الصاج</title>
<style>
  *{box-sizing:border-box}
  :root{--ink:#1c2430;--muted:#667085;--line:#d7dce3;--bg:#f4f6f8;--card:#fff;--blue:#1458c8;--blue-d:#0e439c;--green:#177245;--red:#b42318;--amber:#8a5a00}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:14px 14px 40px}
  header{background:linear-gradient(135deg,#123f7b,#1d6fb8);color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:14px}
  header h1{margin:0;font-size:22px}
  header p{margin:6px 0 0;font-size:14px;opacity:.92}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .btn{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-d)}
  .btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn-danger{background:#fdecea;color:var(--red);border:1.5px solid #f5c6c0}
  .btn-sm{padding:7px 11px;font-size:13.5px;border-radius:8px}
  .search-wrap{position:relative;flex:1;min-width:220px}
  .search-wrap input{width:100%;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:11px 40px 11px 12px;font-size:15px;font-family:inherit}
  .combo-toggle{position:absolute;top:50%;transform:translateY(-50%);left:6px;border:0;background:#eef2f7;color:var(--ink);border-radius:8px;width:30px;height:30px;font-size:14px;cursor:pointer}
  .stats{color:var(--muted);font-size:14px;margin:2px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .memo-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .memo-info{font-size:15px;line-height:1.9}
  .memo-info b{font-size:16px}
  .memo-items{color:var(--muted);font-size:13.5px;line-height:1.8}
  .memo-actions{display:flex;gap:6px;flex-wrap:wrap}
  .empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:15px}
  /* النموذج */
  .overlay{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:flex-start;justify-content:center;padding:18px 10px;z-index:50;overflow:auto}
  .overlay.open{display:flex}
  .form-card{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:18px}
  .form-card h2{margin:0 0 12px;font-size:19px}
  .form-card label{display:block;font-weight:700;font-size:14px;margin:10px 0 5px}
  .form-card input[type=text],.form-card input[type=date]{width:100%;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:10px 12px;font-size:15.5px;font-family:inherit}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .items-head{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
  .items-head h3{margin:0;font-size:16px}
  .item-row{display:grid;grid-template-columns:1.6fr .7fr 1fr 34px;gap:8px;margin-top:8px;align-items:start}
  .item-name-wrap{position:relative}
  .item-name-wrap input{width:100%;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:10px 34px 10px 12px;font-size:15px;font-family:inherit}
  .item-name-wrap .combo-toggle{left:4px}
  .item-row input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:10px 12px;font-size:15px;font-family:inherit}
  .row-del{border:0;background:#fdecea;color:var(--red);border-radius:8px;width:34px;height:42px;font-size:16px;cursor:pointer}
  .form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .msg{font-size:14.5px;min-height:20px;margin-top:10px}
  .msg.err{color:var(--red);font-weight:700}
  .msg.ok{color:var(--green);font-weight:700}
  /* قائمة الاقتراحات */
  .sug{position:absolute;z-index:80;background:#fff;border:1.5px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:260px;overflow:auto;min-width:220px}
  .sug button{display:block;width:100%;text-align:right;border:0;background:#fff;padding:10px 12px;font-size:14.5px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .sug button:hover,.sug button.sel{background:#eaf1fb}
  .sug button small{color:var(--muted);display:block;font-size:12.5px}
  .confirm-card{max-width:420px;text-align:center}
  .confirm-card p{font-size:16px;line-height:1.8;margin:6px 0 16px}
  @media (max-width:640px){
    header h1{font-size:19px}
    .frow{grid-template-columns:1fr}
    .item-row{grid-template-columns:1.4fr .8fr;grid-auto-rows:auto}
    .item-row .notes-cell{grid-column:1/3}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>طلبات شراء ورشة أعمال الصاج</h1>
    <p>شركة الدلتا للسكر — قطاع الهندسة الصناعية — الإدارة العامة للورش</p>
  </header>
  <div class="bar">
    <button type="button" class="btn btn-primary" id="newMemoBtn">➕ تسجيل طلب شراء جديد</button>
    <div class="search-wrap">
      <input id="searchBox" type="text" placeholder="ابحث برقم الطلب أو اسم صنف…" autocomplete="off">
      <button type="button" class="combo-toggle" id="searchToggle" aria-label="عرض كل الطلبات">▾</button>
    </div>
  </div>
  <div class="stats" id="memoCount"></div>
  <div id="memoList"></div>
</div>

<div class="overlay" id="formOverlay">
  <div class="form-card">
    <h2 id="formTitle">تسجيل طلب شراء</h2>
    <div class="frow">
      <div>
        <label for="fNumber">رقم الطلب *</label>
        <input id="fNumber" type="text" inputmode="numeric" autocomplete="off">
      </div>
      <div>
        <label for="fDate">تاريخ الطلب *</label>
        <input id="fDate" type="date">
      </div>
    </div>
    <div class="items-head">
      <h3>أصناف الطلب</h3>
      <button type="button" class="btn btn-outline btn-sm" id="addItemBtn">+ إضافة صنف</button>
    </div>
    <div id="itemsEditor"></div>
    <div class="msg" id="formMsg"></div>
    <div class="form-actions">
      <button type="button" class="btn btn-primary" id="saveBtn">حفظ الطلب</button>
      <button type="button" class="btn btn-outline" id="clearFormBtn">مسح الحقول</button>
      <button type="button" class="btn btn-outline" id="closeFormBtn">إغلاق</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="form-card confirm-card">
    <h2>تأكيد</h2>
    <p id="confirmText"></p>
    <div class="form-actions" style="justify-content:center">
      <button type="button" class="btn btn-danger" id="confirmYesBtn">تأكيد</button>
      <button type="button" class="btn btn-outline" id="confirmNoBtn">إلغاء</button>
    </div>
  </div>
</div>

/* ---------- أدوات ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){
  var t = new Date();
  return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
}
/* صيغة العرض: سنة/شهر/يوم (اليوم على اليمين عند القراءة من اليمين للشمال) */
function fmtD(d){
  if(!d) return "—";
  var p = String(d).split("-");
  if(p.length!==3) return d;
  var y = Number(p[0]), m = Number(p[1]), day = Number(p[2]);
  var dt = new Date(y, m-1, day);
  if(!y || !m || !day || dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==day) return "—";
  return p[0]+"/"+p[1]+"/"+p[2];
}
function fmt(d){
  if(!d) return "—";
  var p = String(d).split("-");
  if(p.length!==3) return d;
  return p[2]+"/"+p[1]+"/"+p[0];
}

/* ---------- التخزين (على الجهاز نفسه — يعمل من غير نت) ---------- */
var LS_KEY = "workshopMemosV1";
function loadMemos(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveMemos(list){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(list)); }catch(e){}
}
var memos = loadMemos();
var editingId = null;

/* ---------- عرض السجل ---------- */
function memoItemsText(m){
  return (m.items||[]).map(function(it){ return it.name; }).join("، ");
}
function hayOf(m){
  return (m.number+" "+fmtD(m.date)+" "+fmt(m.date)+" "+memoItemsText(m)).toLowerCase();
}
function visibleMemos(){
  var q = $("searchBox").value.trim().toLowerCase();
  if(!q) return memos.slice();
  return memos.filter(function(m){ return hayOf(m).indexOf(q)!==-1; });
}
function render(){
  var list = visibleMemos();
  $("memoCount").textContent = "عدد المذكرات: " + memos.length;
  var box = $("memoList");
  if(!memos.length){
    box.innerHTML = '<div class="card empty">لا توجد مذكرات مسجلة بعد — اضغط «تسجيل طلب شراء جديد» لإضافة أول طلب.</div>';
    return;
  }
  if(!list.length){
    box.innerHTML = '<div class="card empty">لا توجد مذكرات مطابقة للبحث.</div>';
    return;
  }
  box.innerHTML = list.map(function(m){
    var items = (m.items||[]).map(function(it){
      return esc(it.name) + " — " + esc(it.qty) + (it.notes ? " ("+esc(it.notes)+")" : "");
    }).join("<br>");
    return '<div class="card"><div class="memo-row"><div class="memo-info">'+
      '<b>طلب رقم '+esc(m.number)+'</b> &nbsp;•&nbsp; التاريخ: '+esc(fmtD(m.date))+' &nbsp;•&nbsp; الأصناف: '+(m.items||[]).length+
      '<div class="memo-items">'+items+'</div></div>'+
      '<div class="memo-actions">'+
      '<button type="button" class="btn btn-primary btn-sm" data-print="'+esc(m.id)+'">🖨️ طباعة المذكرة</button>'+
      '<button type="button" class="btn btn-outline btn-sm" data-edit="'+esc(m.id)+'">تعديل</button>'+
      '<button type="button" class="btn btn-danger btn-sm" data-del="'+esc(m.id)+'">حذف</button>'+
      '</div></div></div>';
  }).join("");
}
$("searchBox").addEventListener("input", render);
$("memoList").addEventListener("click", function(e){
  var t = e.target.closest("button");
  if(!t) return;
  if(t.hasAttribute("data-print")){ printMemo(t.getAttribute("data-print")); return; }
  if(t.hasAttribute("data-edit")){ openForm(t.getAttribute("data-edit")); return; }
  if(t.hasAttribute("data-del")){
    var m = memos.find(function(x){ return x.id===t.getAttribute("data-del"); });
    if(m){
      askConfirm("حذف طلب رقم "+m.number+"؟", function(){
        memos = memos.filter(function(x){ return x.id!==m.id; });
        saveMemos(memos); render();
      });
    }
  }
});

  }).join("") || '<button type="button" disabled>لا توجد مذكرات</button>';
  div.addEventListener("mousedown", function(e){
    var b = e.target.closest("button[data-num]");
    if(!b) return;
    e.preventDefault();
    $("searchBox").value = b.getAttribute("data-num");
    hideSearchSug(); render(); $("searchBox").focus();
  });
  document.body.appendChild(div);
  searchSug = div;
}
$("searchToggle").addEventListener("click", function(){
  if(searchSug){ hideSearchSug(); } else { showAllMemos(); }
});
$("searchBox").addEventListener("focus", hideSearchSug);
document.addEventListener("click", function(e){
  if(searchSug && !e.target.closest(".sug") && e.target.id!=="searchBox" && e.target.id!=="searchToggle") hideSearchSug();
});

/* نافذة تأكيد داخل التطبيق (بدل نافذة المتصفح) */
var confirmYes = null;
function askConfirm(text, onYes){
  $("confirmText").textContent = text;
  confirmYes = onYes;
  $("confirmOverlay").classList.add("open");
}
$("confirmYesBtn").addEventListener("click", function(){
  $("confirmOverlay").classList.remove("open");
  var cb = confirmYes; confirmYes = null;
  if(cb) cb();
});
$("confirmNoBtn").addEventListener("click", function(){
  $("confirmOverlay").classList.remove("open");
  confirmYes = null;
});
$("confirmOverlay").addEventListener("click", function(e){
  if(e.target === $("confirmOverlay")){
    $("confirmOverlay").classList.remove("open");
    confirmYes = null;
  }
});

/* ---------- نموذج التسجيل ---------- */
var formItems = [{name:"", qty:"", notes:""}];
function setFormItems(list){
  formItems = (list||[]).map(function(it){
    return {name: it.name||"", qty: it.qty||"", notes: it.notes||""};
  });
  if(!formItems.length) formItems = [{name:"", qty:"", notes:""}];
  renderItemsEditor();
}
function renderItemsEditor(){
  $("itemsEditor").innerHTML = formItems.map(function(it, i){
    return '<div class="item-row">'+
      '<div class="item-name-wrap"><input type="text" class="it-name" data-row="'+i+'" placeholder="اسم الصنف" value="'+esc(it.name)+'" autocomplete="off">'+
      '<button type="button" class="combo-toggle" data-item-arrow="'+i+'" aria-label="عرض كل الأصناف">▾</button></div>'+
      '<input type="text" class="it-qty" data-row="'+i+'" placeholder="العدد/الكمية" value="'+esc(it.qty)+'" autocomplete="off">'+
      '<input type="text" class="it-notes notes-cell" data-row="'+i+'" placeholder="ملاحظات" value="'+esc(it.notes)+'" autocomplete="off">'+
      '<button type="button" class="row-del" data-del-row="'+i+'" aria-label="حذف الصنف">✕</button>'+
      '</div>';
  }).join("");
}
function collectFormItems(){
  return formItems.map(function(it){
    return {name:(it.name||"").trim(), qty:(it.qty||"").trim(), notes:(it.notes||"").trim()};
  }).filter(function(it){ return it.name || it.qty || it.notes; });
}
$("itemsEditor").addEventListener("input", function(e){
  var row = e.target.getAttribute("data-row");
  if(row===null) return;
  var i = Number(row);
  if(e.target.classList.contains("it-name")){
    formItems[i].name = e.target.value;
    showItemSuggest(e.target, false);
  }else if(e.target.classList.contains("it-qty")){
    formItems[i].qty = e.target.value;
  }else if(e.target.classList.contains("it-notes")){
    formItems[i].notes = e.target.value;
  }
});
$("itemsEditor").addEventListener("click", function(e){
  var del = e.target.closest("[data-del-row]");
  if(del){
    var i = Number(del.getAttribute("data-del-row"));
    formItems.splice(i, 1);
    if(!formItems.length) formItems = [{name:"", qty:"", notes:""}];
    renderItemsEditor();
    return;
  }
  var arrow = e.target.closest("[data-item-arrow]");
  if(arrow){
    var idx = Number(arrow.getAttribute("data-item-arrow"));
    var input = $("itemsEditor").querySelector('.it-name[data-row="'+idx+'"]');
    if(input){ input.focus(); showItemSuggest(input, true); }
  }
});
$("addItemBtn").addEventListener("click", function(){
  formItems.push({name:"", qty:"", notes:""});
  renderItemsEditor();
  var inputs = $("itemsEditor").querySelectorAll(".it-name");
  if(inputs.length) inputs[inputs.length-1].focus();
});

/* اقتراحات اسم الصنف من الدليل المدمج */
var itemSug = null, itemSugInput = null, itemSugSel = -1;
function hideItemSuggest(){ if(itemSug){ itemSug.remove(); itemSug = null; itemSugInput = null; itemSugSel = -1; } }
function showItemSuggest(input, showAll){
  hideItemSuggest();
  var q = (input.value||"").trim().toLowerCase();
  var list = showAll ? CATALOG.slice(0, 500) : CATALOG.filter(function(it){
    return !q || it.n.indexOf(q)!==-1 || it.name.toLowerCase().indexOf(q)!==-1;
  }).slice(0, 8);
  if(!list.length) return;
  var r = input.getBoundingClientRect();
  var div = document.createElement("div");
  div.className = "sug";
  div.style.top = (r.bottom + window.scrollY + 4) + "px";
  div.style.right = (window.innerWidth - r.right) + "px";
  div.style.minWidth = r.width + "px";
  div.innerHTML = list.map(function(it, idx){
    return '<button type="button" data-sug="'+idx+'" data-num="'+esc(it.n)+'" data-name="'+esc(it.name)+'">'+esc(it.name)+'<small>رقم الصنف: '+esc(it.n)+'</small></button>';
  }).join("");
  div._items = list;
  div.addEventListener("mousedown", function(e){
    var b = e.target.closest("button[data-sug]");
    if(!b) return;
    e.preventDefault();
    pickItemSuggestion(b);
  });
  document.body.appendChild(div);
  itemSug = div; itemSugInput = input; itemSugSel = -1;
}
function pickItemSuggestion(btn){
  if(!itemSugInput) return;
  var row = Number(itemSugInput.getAttribute("data-row"));
  var name = btn.getAttribute("data-name");
  itemSugInput.value = name;
  formItems[row].name = name;
  hideItemSuggest();
  var qty = $("itemsEditor").querySelector('.it-qty[data-row="'+row+'"]');
  if(qty) qty.focus();
}
document.addEventListener("keydown", function(e){
  if(itemSug && itemSugInput){
    var btns = itemSug.querySelectorAll("button[data-sug]");
    if(e.key==="ArrowDown" || e.key==="ArrowUp"){
      e.preventDefault();
      itemSugSel = e.key==="ArrowDown"
        ? Math.min(itemSugSel+1, btns.length-1)
        : Math.max(itemSugSel-1, 0);
      btns.forEach(function(b){ b.classList.remove("sel"); });
      if(btns[itemSugSel]) btns[itemSugSel].classList.add("sel");
    }else if(e.key==="Enter" && itemSugSel>=0 && btns[itemSugSel]){
      e.preventDefault();
      pickItemSuggestion(btns[itemSugSel]);
    }else if(e.key==="Escape"){
      hideItemSuggest();
    }
  }
});
document.addEventListener("click", function(e){
  if(itemSug && !e.target.closest(".sug") && !e.target.classList.contains("it-name") && !e.target.hasAttribute("data-item-arrow")) hideItemSuggest();
});

/* التنقل بين الخانات بالإنتر والأسهم */
$("formOverlay").addEventListener("keydown", function(e){
  if(itemSug) return;
  var order = [$("fNumber"), $("fDate")];
  $("itemsEditor").querySelectorAll(".it-name,.it-qty,.it-notes").forEach(function(el){ order.push(el); });
  order.push($("saveBtn"));
  var idx = order.indexOf(document.activeElement);
  if(idx===-1) return;
  if(e.key==="Enter" || e.key==="ArrowDown" || e.key==="ArrowUp"){
    if(document.activeElement === $("saveBtn")) return;
    e.preventDefault();
    var next;
    if(e.key==="ArrowUp"){ next = idx-1; if(next<0) next = 0; }
    else{
      next = idx+1;
      if(next>=order.length){
        if(document.activeElement.classList && document.activeElement.classList.contains("it-notes")){
          formItems.push({name:"", qty:"", notes:""});
          renderItemsEditor();
          var names = $("itemsEditor").querySelectorAll(".it-name");
          if(names.length) names[names.length-1].focus();
          return;
        }
        next = order.length-1;
      }
    }
    if(order[next]) order[next].focus();
  }
});

/* فتح/إغلاق النموذج */
function formHasData(){
  return $("fNumber").value.trim()!=="" || $("fDate").value!=="" ||
    collectFormItems().length>0;
}
function openForm(id){
  editingId = id || null;
  $("formMsg").textContent = "";
  $("formMsg").className = "msg";
  if(editingId){
    var m = memos.find(function(x){ return x.id===editingId; });
    if(!m){ editingId = null; return; }
    $("formTitle").textContent = "تعديل طلب شراء";
    $("saveBtn").textContent = "حفظ التعديلات";
    $("fNumber").value = m.number;
    $("fDate").value = m.date;
    setFormItems(m.items);
  }else{
    $("formTitle").textContent = "تسجيل طلب شراء";
    $("saveBtn").textContent = "حفظ الطلب";
    $("fNumber").value = "";
    $("fDate").value = todayISO();
    setFormItems([]);
  }
  $("formOverlay").classList.add("open");
  $("fNumber").focus();
}
function doCloseForm(){
  $("formOverlay").classList.remove("open");
  editingId = null;
}
function closeForm(){
  if(formHasData()){
    askConfirm("فيه بيانات غير محفوظة — تقفل من غير ما تحفظ؟", doCloseForm);
  }else{
    doCloseForm();
  }
}
$("newMemoBtn").addEventListener("click", function(){ openForm(null); });
$("closeFormBtn").addEventListener("click", closeForm);
$("formOverlay").addEventListener("click", function(e){
  if(e.target === $("formOverlay")) closeForm();
});
$("clearFormBtn").addEventListener("click", function(){
  $("fNumber").value = "";
  $("fDate").value = todayISO();
  setFormItems([]);
  $("formMsg").textContent = "";
  $("fNumber").focus();
});
$("saveBtn").addEventListener("click", function(){
  var num = $("fNumber").value.trim();
  var date = $("fDate").value;
  var items = collectFormItems();
  var msg = $("formMsg");
  function err(t){ msg.textContent = t; msg.className = "msg err"; }
  if(!num || !date){ err("من فضلك املأ رقم الطلب وتاريخ الطلب."); return; }
  if(!items.length){ err("من فضلك أضف صنفًا واحدًا على الأقل."); return; }
  for(var i=0;i<items.length;i++){
    if(!items[i].name || !items[i].qty){ err("كل صنف لازم له اسم صنف وعدد/كمية."); return; }
  }
  var dup = memos.find(function(x){ return x.number===num && x.id!==editingId; });
  if(dup){ err("رقم الطلب ده متسجل قبل كده."); return; }
  if(editingId){
    var m = memos.find(function(x){ return x.id===editingId; });
    m.number = num; m.date = date; m.items = items;
    msg.textContent = "تم حفظ التعديلات."; msg.className = "msg ok";
  }else{
    memos.unshift({id: uid(), number: num, date: date, items: items, createdAt: Date.now()});
    msg.textContent = "تم تسجيل الطلب رقم "+num+"."; msg.className = "msg ok";
  }
  saveMemos(memos); render();
  setTimeout(function(){
    $("formOverlay").classList.remove("open");
    editingId = null;
  }, 500);
});

/* ---------- طباعة المذكرة ---------- */
function buildMemoHTML(m){
  var rows = (m.items||[]).map(function(it, i){
    return "<tr><td style='text-align:center'>"+(i+1)+"</td><td>"+esc(it.name)+"</td><td style='text-align:center'>"+esc(it.qty)+"</td><td>"+esc(it.notes||"")+"</td></tr>";
  }).join("");
  for(var k=0;k<3;k++){
    rows += "<tr><td style='text-align:center'>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>";
  }
  return "<!doctype html><html lang='ar' dir='rtl'><head><meta charset='utf-8'><title>مذكرة طلب شراء "+esc(m.number)+"</title>"+
    "<style>body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;color:#000;margin:0;padding:24px}"+
    "@page{size:A4;margin:14mm}"+
    ".c{text-align:center}.r{text-align:right}h1{font-size:22px;margin:4px 0}"+
    ".head{font-size:15px;line-height:1.9}.memo-title{font-size:17px;font-weight:700;margin:18px 0 4px}"+
    ".intro{font-size:15px;margin:10px 0}.meta{font-size:14px;margin:6px 0 12px}"+
    "table{width:100%;border-collapse:collapse;font-size:15px}th,td{border:1.5px solid #000;padding:8px 10px}th{background:#eee;text-align:center}"+
    "td{height:30px}.sign{margin-top:46px;display:flex;justify-content:space-between;font-size:15px;font-weight:700}"+
    ".sign div{width:30%;text-align:center}.btns{margin-top:24px;text-align:center}"+
    ".btns button{font-family:inherit;font-size:15px;font-weight:700;padding:10px 22px;border-radius:8px;cursor:pointer;margin:0 6px}"+
    "@media print{.btns{display:none}body{padding:0}}</style></head><body>"+
    "<div class='c'><h1>شركة الدلتا للسكر</h1></div>"+
    "<div class='r head'>قطاع الهندسة الصناعية<br>الإدارة العامة للورش<br>ورشة أعمال الصاج</div>"+
    "<div class='c memo-title'>مذكرة للعرض على السيد المهندس<br>رئيس قطاعات المصانع</div>"+
    "<div class='r intro'>برجاء التكرم بالموافقة على شراء الاصناف التالية</div>"+
    "<div class='r meta'>مذكرة رقم: <b>"+esc(m.number)+"</b> &nbsp;•&nbsp; التاريخ: <b>"+esc(fmtD(m.date))+"</b></div>"+
    "<table><thead><tr><th style='width:7%'>م</th><th style='width:43%'>اسم الصنف</th><th style='width:20%'>العدد/الكمية</th><th style='width:30%'>ملاحظات</th></tr></thead><tbody>"+rows+"</tbody></table>"+
    "<div class='sign'><div>الرئيس المباشر</div><div>مدير عام الورش</div><div>رئيس قطاع الهندسة الصناعية</div></div>"+
    "<div class='btns'><button onclick='window.print()'>🖨️ طباعة</button><button onclick='window.close()'>إغلاق</button></div>"+
    "</body></html>";
}
function printMemo(id){
  var m = memos.find(function(x){ return x.id===id; });
  if(!m) return;
  var w = window.open("", "_blank");
  if(!w){ alert("اسمح بفتح النوافذ المنبثقة لعرض المذكرة."); return; }
  w.document.write(buildMemoHTML(m));
  w.document.close();
  w.focus();
}

render();
</script>
